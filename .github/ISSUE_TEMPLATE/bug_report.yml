name: Bug report
description: Report a bug
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations: { required: true }
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: Node 22 / Chrome 120 / Cloudflare Workers
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code or repo link.
      render: ts
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual }
    validations: { required: true }
